# CI (DECISIONS D-CI): lint, tests (layers 1-4 + frontend) and the
# end-to-end smoke test on every push to main and every pull request.
#
# No secrets: the LLM always runs in mock mode here. `make test-live` and
# `make eval` call the paid API and never run in CI (D-TEST).

name: CI

on:
  push:
    branches: [main]
    # Docs-only changes skip CI (the same list for both triggers).
    paths-ignore:
      - "**.md"
      - "ai-sessions/**"
      - "eval/reports/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "ai-sessions/**"
      - "eval/reports/**"

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Starts Postgres with docker compose, then runs layers 1-4 and Vitest.
      - run: make test
      - name: Postgres logs
        if: failure()
        run: docker compose logs --no-color postgres

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      # Same start-up as `make up`. --wait returns once web and worker are
      # healthy, which needs a finished seed and healthy api/mockprovider.
      - name: Start the system
        run: docker compose up --build --detach --wait --wait-timeout 300 web worker
      - run: make smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the system
        if: always()
        run: docker compose down -v
