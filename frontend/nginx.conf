server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser sees one origin (no CORS), as with the Vite proxy in dev.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE: pass every event through immediately (D-STREAM). The API also
        # sends X-Accel-Buffering: no; turning it off here covers all of /api.
        proxy_buffering off;
        proxy_cache off;
        # Streams stay open longer than the 60 s default; the API sends a
        # ping every 15 s.
        proxy_read_timeout 1h;
    }

    # Vite puts content-hashed files here, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/campaigns/:id) are served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
